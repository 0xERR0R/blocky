openapi: 3.1.1
info:
  title: Blockasaurus config API
  description: Configuration management endpoints for Blockasaurus DNS proxy
  version: '1.0'
servers:
  - url: /api/config
paths:
  /client-groups:
    get:
      operationId: listClientGroups
      tags: [client-groups]
      summary: List all client groups
      responses:
        '200':
          description: List of client groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientGroup'
  /client-groups/{name}:
    get:
      operationId: getClientGroup
      tags: [client-groups]
      summary: Get a client group by name
      parameters:
        - $ref: '#/components/parameters/ClientGroupName'
      responses:
        '200':
          description: Client group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientGroup'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: putClientGroup
      tags: [client-groups]
      summary: Create or update a client group
      parameters:
        - $ref: '#/components/parameters/ClientGroupName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientGroupInput'
      responses:
        '200':
          description: Saved client group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      operationId: deleteClientGroup
      tags: [client-groups]
      summary: Delete a client group
      parameters:
        - $ref: '#/components/parameters/ClientGroupName'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /blocklist-sources:
    get:
      operationId: listBlocklistSources
      tags: [blocklist-sources]
      summary: List blocklist sources
      parameters:
        - name: group_name
          in: query
          schema:
            type: string
        - name: list_type
          in: query
          schema:
            type: string
            enum: [deny, allow]
      responses:
        '200':
          description: List of blocklist sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlocklistSource'
    post:
      operationId: createBlocklistSource
      tags: [blocklist-sources]
      summary: Create a blocklist source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlocklistSourceInput'
      responses:
        '201':
          description: Created blocklist source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlocklistSource'
        '400':
          $ref: '#/components/responses/BadRequest'
  /blocklist-sources/{id}:
    get:
      operationId: getBlocklistSource
      tags: [blocklist-sources]
      summary: Get a blocklist source by ID
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Blocklist source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlocklistSource'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateBlocklistSource
      tags: [blocklist-sources]
      summary: Update a blocklist source
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlocklistSourceInput'
      responses:
        '200':
          description: Updated blocklist source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlocklistSource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteBlocklistSource
      tags: [blocklist-sources]
      summary: Delete a blocklist source
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /custom-dns:
    get:
      operationId: listCustomDNSEntries
      tags: [custom-dns]
      summary: List custom DNS entries
      responses:
        '200':
          description: List of custom DNS entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomDNSEntry'
    post:
      operationId: createCustomDNSEntry
      tags: [custom-dns]
      summary: Create a custom DNS entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomDNSEntryInput'
      responses:
        '201':
          description: Created custom DNS entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomDNSEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
  /custom-dns/{id}:
    get:
      operationId: getCustomDNSEntry
      tags: [custom-dns]
      summary: Get a custom DNS entry by ID
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Custom DNS entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomDNSEntry'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateCustomDNSEntry
      tags: [custom-dns]
      summary: Update a custom DNS entry
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomDNSEntryInput'
      responses:
        '200':
          description: Updated custom DNS entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomDNSEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteCustomDNSEntry
      tags: [custom-dns]
      summary: Delete a custom DNS entry
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /domain-entries:
    get:
      operationId: listDomainEntries
      tags: [domain-entries]
      summary: List domain entries
      parameters:
        - name: entry_type
          in: query
          schema:
            type: string
            enum: [exact_deny, regex_deny, exact_allow, regex_allow]
      responses:
        '200':
          description: List of domain entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DomainEntry'
    post:
      operationId: createDomainEntry
      tags: [domain-entries]
      summary: Create a domain entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainEntryInput'
      responses:
        '201':
          description: Created domain entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
  /domain-entries/{id}:
    get:
      operationId: getDomainEntry
      tags: [domain-entries]
      summary: Get a domain entry by ID
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Domain entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainEntry'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateDomainEntry
      tags: [domain-entries]
      summary: Update a domain entry
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainEntryInput'
      responses:
        '200':
          description: Updated domain entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteDomainEntry
      tags: [domain-entries]
      summary: Delete a domain entry
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /block-settings:
    get:
      operationId: getBlockSettings
      tags: [block-settings]
      summary: Get block settings
      responses:
        '200':
          description: Current block settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockSettings'
    put:
      operationId: putBlockSettings
      tags: [block-settings]
      summary: Update block settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockSettingsInput'
      responses:
        '200':
          description: Updated block settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockSettings'
        '400':
          $ref: '#/components/responses/BadRequest'

  /upstream-groups:
    get:
      operationId: listUpstreamGroups
      tags: [upstream-groups]
      summary: List all upstream groups
      responses:
        '200':
          description: List of upstream groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UpstreamGroup'
  /upstream-groups/{name}:
    get:
      operationId: getUpstreamGroup
      tags: [upstream-groups]
      summary: Get an upstream group by name
      parameters:
        - $ref: '#/components/parameters/UpstreamGroupName'
      responses:
        '200':
          description: Upstream group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamGroup'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: putUpstreamGroup
      tags: [upstream-groups]
      summary: Create or update an upstream group
      parameters:
        - $ref: '#/components/parameters/UpstreamGroupName'
      responses:
        '200':
          description: Saved upstream group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      operationId: deleteUpstreamGroup
      tags: [upstream-groups]
      summary: Delete an upstream group (default group cannot be deleted)
      parameters:
        - $ref: '#/components/parameters/UpstreamGroupName'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /upstream-groups/{name}/servers:
    get:
      operationId: listUpstreamServers
      tags: [upstream-groups]
      summary: List servers in an upstream group
      parameters:
        - $ref: '#/components/parameters/UpstreamGroupName'
      responses:
        '200':
          description: List of upstream servers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UpstreamServer'
    post:
      operationId: createUpstreamServer
      tags: [upstream-groups]
      summary: Add a server to an upstream group
      parameters:
        - $ref: '#/components/parameters/UpstreamGroupName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpstreamServerInput'
      responses:
        '201':
          description: Created upstream server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamServer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /upstream-groups/{name}/servers/{id}:
    put:
      operationId: updateUpstreamServer
      tags: [upstream-groups]
      summary: Update an upstream server
      parameters:
        - $ref: '#/components/parameters/UpstreamGroupName'
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpstreamServerInput'
      responses:
        '200':
          description: Updated upstream server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamServer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteUpstreamServer
      tags: [upstream-groups]
      summary: Delete an upstream server
      parameters:
        - $ref: '#/components/parameters/UpstreamGroupName'
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /upstream-settings:
    get:
      operationId: getUpstreamSettings
      tags: [upstream-settings]
      summary: Get global upstream settings
      responses:
        '200':
          description: Current upstream settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamSettings'
    put:
      operationId: putUpstreamSettings
      tags: [upstream-settings]
      summary: Update global upstream settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpstreamSettingsInput'
      responses:
        '200':
          description: Updated upstream settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamSettings'
        '400':
          $ref: '#/components/responses/BadRequest'

  /apply:
    post:
      operationId: applyConfig
      tags: [apply]
      summary: Apply pending configuration changes
      description: Rebuilds the resolver chain from the current DB state
      responses:
        '200':
          description: Configuration applied successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyResponse'
        '500':
          description: Apply failed (DB changes preserved, old chain stays active)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyResponse'

components:
  parameters:
    ClientGroupName:
      name: name
      in: path
      required: true
      schema:
        type: string
    UpstreamGroupName:
      name: name
      in: path
      required: true
      schema:
        type: string
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ClientGroup:
      type: object
      required: [id, name, slug, clients, groups]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        clients:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string

    ClientGroupInput:
      type: object
      properties:
        clients:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string

    BlocklistSource:
      type: object
      required: [id, group_name, list_type, source_type, source, enabled]
      properties:
        id:
          type: integer
        group_name:
          type: string
        list_type:
          type: string
          enum: [deny, allow]
        source_type:
          type: string
          enum: [http, file, text]
        source:
          type: string
        enabled:
          type: boolean

    BlocklistSourceInput:
      type: object
      required: [group_name, list_type, source_type, source, enabled]
      properties:
        group_name:
          type: string
        list_type:
          type: string
          enum: [deny, allow]
        source_type:
          type: string
          enum: [http, file, text]
        source:
          type: string
        enabled:
          type: boolean

    CustomDNSEntry:
      type: object
      required: [id, domain, record_type, value, ttl, enabled]
      properties:
        id:
          type: integer
        domain:
          type: string
        record_type:
          type: string
          enum: [A, AAAA, CNAME]
        value:
          type: string
        ttl:
          type: integer
          minimum: 0
          maximum: 4294967295
        enabled:
          type: boolean

    CustomDNSEntryInput:
      type: object
      required: [domain, record_type, value, ttl, enabled]
      properties:
        domain:
          type: string
        record_type:
          type: string
          enum: [A, AAAA, CNAME]
        value:
          type: string
        ttl:
          type: integer
          minimum: 0
          maximum: 4294967295
        enabled:
          type: boolean

    DomainEntry:
      type: object
      required: [id, domain, entry_type, comment, enabled, group_name]
      properties:
        id:
          type: integer
        domain:
          type: string
        entry_type:
          type: string
          enum: [exact_deny, regex_deny, exact_allow, regex_allow]
        comment:
          type: string
        enabled:
          type: boolean
        group_name:
          type: string

    DomainEntryInput:
      type: object
      required: [domain, entry_type, enabled]
      properties:
        domain:
          type: string
        entry_type:
          type: string
          enum: [exact_deny, regex_deny, exact_allow, regex_allow]
        comment:
          type: string
        enabled:
          type: boolean

    BlockSettings:
      type: object
      required: [block_type, block_ttl]
      properties:
        block_type:
          type: string
        block_ttl:
          type: string

    BlockSettingsInput:
      type: object
      required: [block_type, block_ttl]
      properties:
        block_type:
          type: string
        block_ttl:
          type: string

    UpstreamGroup:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string

    UpstreamServer:
      type: object
      required: [id, group_name, url, position, enabled]
      properties:
        id:
          type: integer
        group_name:
          type: string
        url:
          type: string
          description: >-
            Upstream server in `[net:]host[:port][/path][#commonName]` form, or a
            DNS stamp (`sdns://...`). Supported `net` prefixes are `tcp+udp`
            (default when omitted), `tcp-tls`, `https://` and `quic:`. `quic://`
            is also accepted on input for AdGuard compatibility.
          example: quic:dns.adguard.com
        position:
          type: integer
        enabled:
          type: boolean

    UpstreamServerInput:
      type: object
      required: [url, enabled]
      properties:
        url:
          type: string
          description: >-
            Upstream server in `[net:]host[:port][/path][#commonName]` form, or a
            DNS stamp (`sdns://...`). Supported `net` prefixes are `tcp+udp`
            (default when omitted), `tcp-tls`, `https://` and `quic:`. `quic://`
            is also accepted on input for AdGuard compatibility.
          example: quic:dns.adguard.com
        position:
          type: integer
        enabled:
          type: boolean

    UpstreamSettings:
      type: object
      required: [strategy, timeout, user_agent, init_strategy]
      properties:
        strategy:
          type: string
          enum: [parallel_best, strict, random]
        timeout:
          type: string
        user_agent:
          type: string
        init_strategy:
          type: string
          enum: [blocking, failOnError, fast]

    UpstreamSettingsInput:
      type: object
      required: [strategy, timeout, user_agent, init_strategy]
      properties:
        strategy:
          type: string
          enum: [parallel_best, strict, random]
        timeout:
          type: string
        user_agent:
          type: string
        init_strategy:
          type: string
          enum: [blocking, failOnError, fast]

    ApplyResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [ok, error]
        message:
          type: string
        error:
          type: string

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
