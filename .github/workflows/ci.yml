name: CI

# Until this existed, the only workflow in the repo was the tag-triggered
# release, which runs no tests. That made "the upstream merge fails the build if
# it drops a route" mean "it fails if somebody remembers to run the suite
# locally". The guardrails in docs/UPSTREAM_SYNC.md §3a are only guardrails if
# something runs them without being asked.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    # Normally ~2 minutes. The cap is here because this suite can hang rather
    # than fail: several specs bind listeners, and when one collides with a port
    # another spec already took it has been seen both to fail fast
    # (`bind: address already in use`) and to wait forever. Without a cap a hang
    # holds a runner for GitHub's 6-hour default. See GRA-650.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # server/ embeds web/ui/dist, so no Go package that imports web/ compiles
      # until the SPA is built. Same steps as release.yml, which is also why
      # there is no lockfile step here.
      - name: Build frontend
        run: cd web/ui && npm install && npx vite build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # Runs the non-e2e suite, including TestAPIContract and
      # TestAPISpecContract, and depends on check-fork-additions. The e2e suite
      # needs a built container image and runs in the `e2e` job below.
      - name: Test
        run: make test

  # The e2e suite had never run at all across four phases of the upstream sync,
  # for one reason: no dev/agent runtime in the loop had a container runtime, so
  # it kept being deferred to "the next phase". GitHub-hosted runners do have
  # Docker, so it runs here.
  #
  # `make e2e-test-baseline` builds the image with `docker buildx` and runs the
  # suite against it, so this also covers `make docker-build`'s Dockerfile —
  # which had never been built either. It is NOT the release image: release.yml
  # runs goreleaser against Dockerfile.goreleaser. That one is covered by the
  # `release-image` job below, not by this one.
  #
  # The pass/fail decision comes from tools/e2ebaseline, not from ginkgo's exit
  # status: the suite's first run was 43/162 red from causes that predate the
  # job, so the recorded baseline is what keeps this a gate that can catch a
  # regression instead of a permanently red X that trains people to ignore CI.
  #
  # Deliberately a separate job rather than more steps on `test`: the fast job
  # stays a ~2 minute PR signal, and a red e2e does not hide a red unit suite.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # Docker image build + ~162 specs that each start containers. Generous on
    # purpose: a job killed at the boundary reports as "broken" when it was only
    # slow, and this suite's whole value is that its failures are attributable.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # No frontend build step: the e2e package does not import web/, and the
      # image builds the SPA in its own Dockerfile stage.
      #
      # No docker/setup-buildx-action either. The preinstalled default builder
      # uses the docker driver, which is what `-o type=docker` and
      # `--network=host` in the Makefile target expect; a docker-container
      # builder would need --load and an explicit network.host entitlement.
      - name: e2e
        # ubuntu-latest is 4 vCPU, so -procs=4 matches the Makefile's local
        # default of -p. Pinned rather than oversubscribed for now: container
        # readiness has a 30s startup timeout, and a starved postgres/mariadb
        # spec failing that would be indistinguishable from a real regression.
        # Raise it once the suite has a known-green baseline here.
        env:
          GINKGO_E2E_PROCS: -procs=4
          GINKGO_E2E_TIMEOUT: 35m
        run: make e2e-test-baseline

      # The job log is ~7,800 lines when the suite is unhappy. The machine
      # readable report is what makes a failure diagnosable, and what the
      # baseline lines are copied out of.
      - name: Upload ginkgo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e-report.json
          if-no-files-found: warn

  # The image the e2e job builds is not the image the release ships. release.yml
  # runs goreleaser, which builds `Dockerfile.goreleaser`, and until this job
  # existed nothing built that file at all — the first time the released image
  # existed was on a tag, already on its way to ghcr and from there to the
  # household's DNS. See docs/UPSTREAM_SYNC.md §11.
  #
  # The steps below are release.yml's steps minus the publishing ones, and they
  # are meant to stay that way: the point of the job is that what CI builds and
  # what a tag builds are the same image, so a step that exists in one pipeline
  # and not the other is the defect this job was added to prevent. `--snapshot`
  # is what removes the ghcr login, the push and the GitHub release.
  #
  # Building is only half of it. A `FROM scratch` image that builds is not one
  # that runs: a missing SPA, an unwritable /app/cache or a lost file capability
  # all produce a perfectly good image that fails at start. The smoke step is
  # what makes this a gate rather than a compile check.
  release-image:
    name: Release image
    runs-on: ubuntu-latest
    # goreleaser builds five binary targets, the deb/rpm packages and both
    # container images; ~8 minutes observed. The cap is a hang guard, not a
    # budget.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # goreleaser derives the snapshot version from the tag history, and
          # refuses to run in a shallow clone.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Dockerfile.goreleaser has no `ui` stage: goreleaser hands the image
      # build an already-compiled binary, so the SPA has to be on disk before
      # the Go build embeds it. Dropping this step still produces an image that
      # builds and answers DNS, which is why the smoke step fetches a hashed
      # asset rather than trusting the build.
      - name: Build frontend
        run: cd web/ui && npm install && npx vite build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Kept in step with release.yml rather than trimmed. The arm64 image needs
      # no emulation — Go cross-compiles the binary and the prep stage in
      # Dockerfile.goreleaser is pinned to $BUILDPLATFORM — but a setup step
      # present in one pipeline and absent from the other is exactly the kind of
      # difference this job exists to rule out.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Required: .goreleaser.yml's dockers use `use: buildx` so that
      # `--platform` can stamp the correct architecture into each image config.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build release artifacts
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --clean

      - name: Smoke test the release image
        run: make release-image-smoke

      - name: Upload release manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-snapshot-artifacts
          path: dist/artifacts.json
          if-no-files-found: warn
