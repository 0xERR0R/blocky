name: CI

# Until this existed, the only workflow in the repo was the tag-triggered
# release, which runs no tests. That made "the upstream merge fails the build if
# it drops a route" mean "it fails if somebody remembers to run the suite
# locally". The guardrails in docs/UPSTREAM_SYNC.md §3a are only guardrails if
# something runs them without being asked.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # server/ embeds web/ui/dist, so no Go package that imports web/ compiles
      # until the SPA is built. Same steps as release.yml, which is also why
      # there is no lockfile step here.
      - name: Build frontend
        run: cd web/ui && npm install && npx vite build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # Runs the non-e2e suite, including TestAPIContract and
      # TestAPISpecContract, and depends on check-fork-additions. The e2e suite
      # needs a built container image and runs in the `e2e` job below.
      - name: Test
        run: make test

  # The e2e suite had never run at all across four phases of the upstream sync,
  # for one reason: no dev/agent runtime in the loop had a container runtime, so
  # it kept being deferred to "the next phase". GitHub-hosted runners do have
  # Docker, and `make e2e-test` builds the image from the same Dockerfile that
  # release.yml ships, so this one job closes both gaps — the e2e specs and the
  # "the container image has never been built" gap.
  #
  # Deliberately a separate job rather than more steps on `test`: the fast job
  # stays a ~2 minute PR signal, and a red e2e does not hide a red unit suite.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # Docker image build + ~162 specs that each start containers. Generous on
    # purpose: a job killed at the boundary reports as "broken" when it was only
    # slow, and this suite's whole value is that its failures are attributable.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # No frontend build step: the e2e package does not import web/, and the
      # image builds the SPA in its own Dockerfile stage.
      #
      # No docker/setup-buildx-action either. The preinstalled default builder
      # uses the docker driver, which is what `-o type=docker` and
      # `--network=host` in the Makefile target expect; a docker-container
      # builder would need --load and an explicit network.host entitlement.
      - name: e2e
        # ubuntu-latest is 4 vCPU, so -procs=4 matches the Makefile's local
        # default of -p. Pinned rather than oversubscribed for now: container
        # readiness has a 30s startup timeout, and a starved postgres/mariadb
        # spec failing that would be indistinguishable from a real regression.
        # Raise it once the suite has a known-green baseline here.
        env:
          GINKGO_E2E_PROCS: -procs=4
          GINKGO_E2E_TIMEOUT: 35m
        run: make e2e-test
